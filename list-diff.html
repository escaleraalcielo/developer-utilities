<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List Difference | Dev Utils</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        body,
        html {
            height: 100%;
            overflow: hidden;
        }

        .tool-container {
            height: 100vh;
            padding-bottom: 2rem;
            display: flex;
            flex-direction: column;
        }

        .glass-panel {
            display: flex;
            flex-direction: column;
        }

        textarea.glass-input {
            background-color: rgba(15, 23, 42, 0.4);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            resize: none;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 0.85rem;
            flex-grow: 1;
            white-space: pre;
        }

        textarea.glass-input:focus {
            background-color: rgba(15, 23, 42, 0.6);
            border-color: var(--accent-color);
            color: var(--text-primary);
            box-shadow: 0 0 0 0.25rem rgba(56, 189, 248, 0.15);
        }

        .result-list {
            overflow-y: auto;
            background-color: rgba(15, 23, 42, 0.4);
            border: 1px solid var(--border-color);
            border-radius: 0.375rem;
            flex-grow: 1;
        }

        .result-item {
            padding: 0.25rem 0.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 0.85rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
        }

        .result-item:last-child {
            border-bottom: none;
        }

        .result-item:hover {
            background-color: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
        }

        .invisible-space {
            color: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>

<body>
    <!-- Global Navigation -->
    <div class="global-nav dropdown">
        <button class="btn global-nav-btn" type="button" data-bs-toggle="dropdown" aria-expanded="false">
            <i class="bi bi-list fs-4"></i>
        </button>
        <ul class="dropdown-menu dropdown-menu-end global-nav-dropdown">
            <li><a class="dropdown-item" href="index.html"><i class="bi bi-house-door me-2"></i> Home</a></li>
            <li><a class="dropdown-item" href="column-converter.html"><i class="bi bi-list-columns me-2"></i> Column
                    Converter</a></li>
            <li><a class="dropdown-item" href="id-converter.html"><i class="bi bi-card-heading me-2"></i> ID
                    Converter</a></li>
            <li><a class="dropdown-item active" href="list-diff.html"><i class="bi bi-intersect me-2"></i> List
                    Difference</a></li>
            <li>
                <hr class="dropdown-divider border-secondary border-opacity-25">
            </li>
            <li><a class="dropdown-item" href="guid-generator.html"><i class="bi bi-asterisk me-2"></i> GUID
                    Generator</a></li>
        </ul>
    </div>

    <div class="container-fluid tool-container py-4">
        <!-- Header / Nav -->
        <div class="row mb-3 align-items-center">
            <div class="col-auto">
                <a href="index.html" class="btn btn-outline-light btn-sm rounded-circle p-2">
                    <i class="bi bi-arrow-left"></i>
                </a>
            </div>
            <div class="col">
                <h1 class="h5 mb-0 fw-bold">List Difference Tool</h1>
            </div>
            <div class="col-auto">
                <!-- Clear Button moved to controls -->
            </div>
        </div>

        <!-- Main Grid -->
        <div class="row g-3 h-100 pb-5">

            <!-- List A -->
            <div class="col-lg-3 d-flex flex-column h-50 h-lg-100">
                <div class="glass-panel p-3 flex-grow-1 d-flex flex-column h-100">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <label for="inputA" class="form-label text-info small fw-bold text-uppercase mb-0">List
                            A</label>
                        <span class="badge bg-info bg-opacity-10 text-info" id="countA">0</span>
                    </div>
                    <textarea id="inputA" class="form-control glass-input flex-grow-1 p-3"
                        placeholder="Paste List A here..."></textarea>
                </div>
            </div>

            <!-- List B -->
            <div class="col-lg-3 d-flex flex-column h-50 h-lg-100">
                <div class="glass-panel p-3 flex-grow-1 d-flex flex-column h-100">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <label for="inputB" class="form-label text-warning small fw-bold text-uppercase mb-0">List
                            B</label>
                        <span class="badge bg-warning bg-opacity-10 text-warning" id="countB">0</span>
                    </div>
                    <textarea id="inputB" class="form-control glass-input flex-grow-1 p-3"
                        placeholder="Paste List B here..."></textarea>
                </div>
            </div>

            <!-- Controls & Results -->
            <div class="col-lg-6 d-flex flex-column h-100">
                <!-- Controls -->
                <div class="glass-panel p-3 mb-3">
                    <div class="row align-items-center g-2">
                        <div class="col-auto">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" id="optSmartSF" checked>
                                <label class="form-check-label small text-secondary" for="optSmartSF"
                                    title="Treat 15/18 char alphanumeric strings as Salesforce IDs">Smart SF
                                    Mode</label>
                            </div>
                        </div>
                        <div class="col-auto">
                            <div class="vr h-100 bg-secondary mx-2 opacity-25"></div>
                        </div>
                        <div class="col-auto">
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="checkbox" id="optCaseSensitive">
                                <label class="form-check-label small text-secondary" for="optCaseSensitive">Case
                                    Sensitive</label>
                            </div>
                        </div>
                        <div class="col-auto">
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="checkbox" id="optRemoveDupes" checked>
                                <label class="form-check-label small text-secondary" for="optRemoveDupes">Remove
                                    Duplicates</label>
                            </div>
                        </div>
                        <div class="col-auto">
                            <div class="vr h-100 bg-secondary mx-2 opacity-25"></div>
                        </div>
                        <div class="col-auto">
                            <select class="form-select form-select-sm" id="optSort" style="width: auto;">
                                <option value="AAA">Sort: A-Z</option>
                                <option value="ZZZ">Sort: Z-A</option>
                                <option value="OFF">Sort: Original</option>
                            </select>
                        </div>
                        <div class="col text-end">
                            <button class="btn btn-sm btn-outline-light text-secondary border-0" id="clearAllBtn">
                                <i class="bi bi-trash"></i> Clear All
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Results Grid -->
                <div class="row g-3 flex-grow-1" style="min-height: 0;">

                    <!-- Only In A -->
                    <div class="col-4 d-flex flex-column h-100">
                        <div class="glass-panel p-2 flex-grow-1 d-flex flex-column h-100 overflow-hidden">
                            <div class="d-flex justify-content-between align-items-center mb-2 px-1">
                                <span class="text-info small fw-bold">Only in A</span>
                                <button class="btn btn-sm btn-outline-secondary py-0 px-2" onclick="copyResult('onlyA')"
                                    title="Copy Only in A">
                                    <i class="bi bi-clipboard me-1"></i> Copy
                                </button>
                            </div>
                            <div id="resOnlyA" class="result-list p-0">
                                <!-- Items -->
                            </div>
                            <div class="text-end mt-1 px-1">
                                <span class="small text-secondary fw-bold" id="countOnlyA">0</span>
                            </div>
                        </div>
                    </div>

                    <!-- Common -->
                    <div class="col-4 d-flex flex-column h-100">
                        <div class="glass-panel p-2 flex-grow-1 d-flex flex-column h-100 overflow-hidden">
                            <div class="d-flex justify-content-between align-items-center mb-2 px-1">
                                <span class="text-success small fw-bold">Common</span>
                                <button class="btn btn-sm btn-outline-secondary py-0 px-2"
                                    onclick="copyResult('common')" title="Copy Common">
                                    <i class="bi bi-clipboard me-1"></i> Copy
                                </button>
                            </div>
                            <div id="resCommon" class="result-list p-0">
                                <!-- Items -->
                            </div>
                            <div class="text-end mt-1 px-1">
                                <span class="small text-secondary fw-bold" id="countCommon">0</span>
                            </div>
                        </div>
                    </div>

                    <!-- Only In B -->
                    <div class="col-4 d-flex flex-column h-100">
                        <div class="glass-panel p-2 flex-grow-1 d-flex flex-column h-100 overflow-hidden">
                            <div class="d-flex justify-content-between align-items-center mb-2 px-1">
                                <span class="text-warning small fw-bold">Only in B</span>
                                <button class="btn btn-primary btn-sm px-3" onclick="copyResult('onlyB')"
                                    title="Copy Only in B">
                                    <i class="bi bi-clipboard me-1"></i> Copy
                                </button>
                            </div>
                            <div id="resOnlyB" class="result-list p-0">
                                <!-- Items -->
                            </div>
                            <div class="text-end mt-1 px-1">
                                <span class="small text-secondary fw-bold" id="countOnlyB">0</span>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>

        <!-- Toast Notification -->
        <div class="toast-container position-fixed bottom-0 end-0 p-3">
            <div id="copyToast" class="toast align-items-center text-white bg-success border-0" role="alert"
                aria-live="assertive" aria-atomic="true">
                <div class="d-flex">
                    <div class="toast-body">
                        <i class="bi bi-check-circle me-2"></i> Copied to clipboard!
                    </div>
                    <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"
                        aria-label="Close"></button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="list-diff.js"></script>
</body>

</html>
