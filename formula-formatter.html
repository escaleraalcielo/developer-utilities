<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formula Formatter | Dev Utils</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="favicon.png">

</head>
<body class="app-mode">

    <!-- Global Navigation -->
    <div class="global-nav">
        <a href="index.html" class="btn global-nav-btn" title="Return to Home" aria-label="Return to Home">
            <i class="bi bi-house-door fs-4"></i>
        </a>
    </div>

    <!-- Main Container -->
    <div class="container-fluid tool-container py-4">
        <!-- Header / Nav -->
        <div class="row mb-4 align-items-center">
            <div class="col">
                <h1 class="h4 mb-0 fw-bold">Formula Formatter</h1>
                <p class="text-secondary mb-0 small mt-1">Format and indent massive Salesforce formula fields.</p>
            </div>
        </div>

        <!-- Main Workspace -->
        <main class="row g-4 flex-grow-1 min-h-0">
            <!-- Left Panel: Input -->
            <div class="col-lg-6 d-flex flex-column h-100">
                <div class="glass-panel p-4 d-flex flex-column h-100">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <label for="inputFormula" class="form-label text-secondary small fw-bold text-uppercase mb-2">Raw Formula</label>
                        <div class="d-flex gap-2">
                            <button id="loadSampleBtn" class="btn btn-sm btn-outline-light text-secondary border-0" title="Load Sample" aria-label="Load Sample">
                                <i class="bi bi-file-earmark-text"></i>
                            </button>
                            <button id="clearBtn" class="btn btn-sm btn-outline-light text-secondary border-0" title="Clear" aria-label="Clear">
                                <i class="bi bi-trash"></i>
                            </button>
                        </div>
                    </div>
                    <textarea id="inputFormula" class="form-control glass-input flex-grow-1 mb-3"
                        placeholder="Paste unformatted Salesforce formula here...&#10;e.g. IF(ISPICKVAL(StageName, 'Closed Won'), Amount * 0.1, 0)"></textarea>

                    <div class="row g-3">
                        <div class="col-sm-6">
                            <label class="form-label text-secondary small fw-bold text-uppercase mb-2">Indentation</label>
                            <select id="indentSelect" class="form-select">
                                <option value="2" selected>2 Spaces</option>
                                <option value="4">4 Spaces</option>
                                <option value="\t">Tabs</option>
                            </select>
                        </div>
                        <div class="col-sm-6 d-flex align-items-end">
                            <button id="formatBtn" class="btn btn-primary w-100 py-2">
                                <i class="bi bi-magic me-2"></i> Format Formula
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Panel: Output -->
            <div class="col-lg-6 d-flex flex-column h-100">
                <div class="glass-panel p-4 d-flex flex-column h-100 position-relative">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <label for="outputFormula" class="form-label text-secondary small fw-bold text-uppercase mb-2">Formatted Output</label>
                        <div class="d-flex gap-2">
                            <button id="saveBtn" class="btn btn-sm btn-outline-light text-secondary border-0" title="Save" aria-label="Save" disabled>
                                <i class="bi bi-save"></i>
                            </button>
                        </div>
                    </div>
                    <textarea id="outputFormula" class="form-control glass-input flex-grow-1 mb-3" readonly
                        placeholder="Formatted formula will appear here..."></textarea>

                    <div class="d-flex gap-2">
                        <button id="loadSampleBtnOutput" class="btn btn-outline-light flex-grow-1" title="Load Sample Data">
                            <i class="bi bi-file-earmark-text me-2"></i> Load Sample
                        </button>
                        <button id="copyBtn" class="btn btn-primary btn-sm" disabled>
                            <i class="bi bi-clipboard me-1"></i> Copy
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- External Script -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="sample-data.js"></script>
    <script src="formula-formatter.js"></script>
</body>
</html>
