<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Column to List Converter | Dev Utils</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        .options-panel {
            background: rgba(30, 41, 59, 0.3);
            border-bottom: 1px solid var(--border-color);
        }

        /* Mobile overrides/specifics for this tool */
        @media (max-width: 991.98px) {
            .glass-panel {
                margin-bottom: 1rem;
            }

            #inputData,
            #outputData {
                min-height: 200px;
            }
        }
    </style>
</head>

<body class="app-mode">
    <!-- Global Navigation -->
    <!-- Global Navigation -->
    <div class="global-nav">
        <a href="index.html" class="btn global-nav-btn" title="Return to Home" aria-label="Return to Home">
            <i class="bi bi-house-door fs-4"></i>
        </a>
    </div>

    <div class="container-fluid tool-container py-4">
        <!-- Header / Nav -->
        <div class="row mb-4 align-items-center">
            <div class="col-auto">
                <a href="index.html" class="btn btn-outline-light btn-sm rounded-circle p-2" aria-label="Return to Home">
                    <i class="bi bi-arrow-left"></i>
                </a>
            </div>
            <div class="col">
                <h1 class="h4 mb-0 fw-bold">Column to Comma Separated List</h1>
            </div>
        </div>

        <div class="row g-4 flex-grow-1">
            <!-- Left Column: Input -->
            <div class="col-lg-5 d-flex flex-column desktop-h-100">
                <div class="glass-panel p-4 flex-grow-1 d-flex flex-column">
                    <label for="inputData" class="form-label text-secondary small fw-bold text-uppercase mb-3">Input
                        Column</label>
                    <textarea id="inputData" class="form-control glass-input flex-grow-1 p-3"
                        placeholder="Paste your column data here...&#10;One&#10;Two&#10;Three"></textarea>

                    <!-- Conversion Warning -->
                    <div id="conversionWarning" class="alert alert-warning d-none mt-3 mb-0 py-2 small" role="alert">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i>
                        <span id="conversionWarningMsg"></span>
                    </div>

                    <div class="d-flex justify-content-between mt-3">
                        <span class="text-secondary small" id="inputStats">0 lines</span>
                        <div>
                            <button id="loadSampleBtn" class="btn btn-sm btn-outline-light text-secondary border-0 me-2" title="Load Sample Data">
                                <i class="bi bi-file-earmark-text"></i> Load Sample
                            </button>
                            <button class="btn btn-sm btn-outline-light text-secondary border-0"
                                onclick="document.getElementById('inputData').value=''; updateConversion();">
                                <i class="bi bi-trash"></i> Clear
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Middle Column: Controls -->
            <div class="col-lg-2">
                <div class="glass-panel p-3 h-100">
                    <h6 class="text-secondary small fw-bold text-uppercase mb-3">Configuration</h6>

                    <div class="mb-4">
                        <label class="form-label small text-white">Delimiter</label>
                        <select id="delimiter" class="form-select form-select-sm mb-2">
                            <option value=",">Comma (,)</option>
                            <option value=";">Semicolon (;)</option>
                            <option value="|">Pipe (|)</option>
                            <option value=" ">Space</option>
                            <option value="\n">New Line</option>
                            <option value="custom">Custom...</option>
                        </select>
                        <input type="text" id="customDelimiter" class="form-control form-control-sm glass-input d-none"
                            placeholder="Enter custom char">
                    </div>

                    <div class="mb-4">
                        <label class="form-label small text-white">Wrap Items</label>
                        <select id="quoteType" class="form-select form-select-sm">
                            <option value="none">None</option>
                            <option value="single">Single Quotes (')</option>
                            <option value="double">Double Quotes (")</option>
                        </select>
                    </div>

                    <div class="mb-4">
                        <label class="form-label small text-white">Enclose Result</label>
                        <select id="encloseType" class="form-select form-select-sm mb-2">
                            <option value="none">None</option>
                            <option value="parentheses">Parentheses ( )</option>
                            <option value="brackets">Square Brackets [ ]</option>
                            <option value="curly">Curly Braces { }</option>
                            <option value="custom">Custom...</option>
                        </select>
                        <div id="customEncloseGroup" class="d-none d-flex gap-2">
                            <input type="text" id="customEncloseStart" class="form-control form-control-sm glass-input"
                                placeholder="Start">
                            <input type="text" id="customEncloseEnd" class="form-control form-control-sm glass-input"
                                placeholder="End">
                        </div>
                    </div>

                    <div class="mb-3">
                        <div class="form-check form-switch mb-2">
                            <input class="form-check-input" type="checkbox" id="optionTrim" checked>
                            <label class="form-check-label small text-secondary" for="optionTrim">Trim
                                Whitespace</label>
                        </div>
                        <div class="form-check form-switch mb-2">
                            <input class="form-check-input" type="checkbox" id="optionUnique">
                            <label class="form-check-label small text-secondary" for="optionUnique">Remove
                                Duplicates</label>
                        </div>
                        <div class="form-check form-switch mb-2">
                            <input class="form-check-input" type="checkbox" id="optionSort">
                            <label class="form-check-label small text-secondary" for="optionSort">Sort
                                Alphabetically</label>
                        </div>
                        <div class="form-check form-switch mb-2">
                            <input class="form-check-input" type="checkbox" id="optionIgnoreEmpty" checked>
                            <label class="form-check-label small text-secondary" for="optionIgnoreEmpty">Ignore Empty
                                Lines</label>
                        </div>
                    </div>

                    <button id="resetDefaultsBtn" class="btn btn-sm btn-outline-secondary w-100 mb-3"
                        title="Reset to Comma, Single Quotes, No Enclosure">
                        <i class="bi bi-arrow-counterclockwise"></i> Load Defaults
                    </button>
                </div>
            </div>

            <!-- Right Column: Output -->
            <div class="col-lg-5 d-flex flex-column desktop-h-100">
                <div class="glass-panel p-4 flex-grow-1 d-flex flex-column">
                    <label for="outputData" class="form-label text-secondary small fw-bold text-uppercase mb-3">Result
                        List</label>
                    <textarea id="outputData" class="form-control glass-input flex-grow-1 p-3" readonly></textarea>
                    <div class="d-flex justify-content-between mt-3 align-items-center">
                        <span class="text-secondary small" id="outputStats">0 items</span>
                        <div class="d-flex gap-2">
                            <button id="saveBtn" class="btn btn-success btn-sm px-3">
                                <i class="bi bi-save"></i> Save
                            </button>
                            <button id="copyBtn" class="btn btn-primary btn-sm px-4">
                                <i class="bi bi-clipboard"></i> Copy
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- History Panel -->
        <div class="row mt-4 flex-grow-0" style="height: 300px; min-height: 300px;">
            <div class="col-12 h-100">
                <div class="glass-panel p-0 h-100 d-flex flex-column">
                    <div
                        class="p-3 border-bottom border-secondary border-opacity-10 d-flex justify-content-between align-items-center">
                        <h6 class="text-secondary small fw-bold text-uppercase mb-0">Session History <span
                                class="badge bg-secondary bg-opacity-25 ms-2" id="historyCount">0/20</span></h6>
                        <button class="btn btn-xs btn-link text-secondary text-decoration-none dropdown-toggle small"
                            type="button" data-bs-toggle="collapse" data-bs-target="#historyTableContainer">
                            Toggle
                        </button>
                    </div>
                    <div class="flex-grow-1 overflow-auto collapse show" id="historyTableContainer">
                        <table class="table table-dark table-hover mb-0 text-secondary small bg-transparent">
                            <thead class="sticky-top bg-dark">
                                <tr>
                                    <th scope="col" style="width: 100px;">Time</th>
                                    <th scope="col" style="width: 80px;">Items</th>
                                    <th scope="col">Preview</th>
                                    <th scope="col" style="width: 100px;" class="text-end">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="historyTableBody">
                                <!-- History Rows will be injected here -->
                                <tr class="text-center">
                                    <td colspan="4" class="py-4 text-secondary opacity-50 fst-italic">No saved results
                                        in this session.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="sample-data.js"></script>

    <script src="converter.js"></script>
</body>

</html>
