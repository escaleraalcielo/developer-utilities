<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Column to List Converter | Dev Utils</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
    <style>
        body,
        html {
            height: 100%;
            overflow: hidden;
            /* Prevent body scroll, handle in tool container if needed */
        }

        .tool-container {
            height: 100vh;
            padding-bottom: 2rem;
            display: flex;
            flex-direction: column;
        }

        .glass-panel {
            display: flex;
            flex-direction: column;
        }

        textarea.glass-input {
            background-color: rgba(15, 23, 42, 0.4);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            resize: none;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 0.9rem;
            flex-grow: 1;
            /* Ensure textarea fills the flex container */
        }

        textarea.glass-input:focus {
            background-color: rgba(15, 23, 42, 0.6);
            border-color: var(--accent-color);
            color: var(--text-primary);
            box-shadow: 0 0 0 0.25rem rgba(56, 189, 248, 0.15);
        }

        .options-panel {
            background: rgba(30, 41, 59, 0.3);
            border-bottom: 1px solid var(--border-color);
        }
    </style>
</head>

<body>
    <div class="container-fluid tool-container py-4">
        <!-- Header / Nav -->
        <div class="row mb-4 align-items-center">
            <div class="col-auto">
                <a href="index.html" class="btn btn-outline-light btn-sm rounded-circle p-2">
                    <i class="bi bi-arrow-left"></i>
                </a>
            </div>
            <div class="col">
                <h1 class="h4 mb-0 fw-bold">Column to Comma Separated List</h1>
            </div>
        </div>

        <div class="row g-4 h-100">
            <!-- Left Column: Input -->
            <div class="col-lg-5 d-flex flex-column h-100">
                <div class="glass-panel p-4 flex-grow-1 d-flex flex-column">
                    <label for="inputData" class="form-label text-secondary small fw-bold text-uppercase mb-3">Input
                        Column</label>
                    <textarea id="inputData" class="form-control glass-input flex-grow-1 p-3"
                        placeholder="Paste your column data here...&#10;One&#10;Two&#10;Three"></textarea>
                    <div class="d-flex justify-content-between mt-3">
                        <span class="text-secondary small" id="inputStats">0 lines</span>
                        <button class="btn btn-sm btn-outline-light text-secondary border-0"
                            onclick="document.getElementById('inputData').value=''; updateConversion();">
                            <i class="bi bi-trash"></i> Clear
                        </button>
                    </div>
                </div>
            </div>

            <!-- Middle Column: Controls -->
            <div class="col-lg-2">
                <div class="glass-panel p-3 h-100">
                    <h6 class="text-secondary small fw-bold text-uppercase mb-3">Configuration</h6>

                    <div class="mb-4">
                        <label class="form-label small text-white">Delimiter</label>
                        <select id="delimiter" class="form-select form-select-sm mb-2">
                            <option value=",">Comma (,)</option>
                            <option value=";">Semicolon (;)</option>
                            <option value="|">Pipe (|)</option>
                            <option value=" ">Space</option>
                            <option value="\n">New Line</option>
                            <option value="custom">Custom...</option>
                        </select>
                        <input type="text" id="customDelimiter" class="form-control form-control-sm glass-input d-none"
                            placeholder="Enter custom char">
                    </div>

                    <div class="mb-4">
                        <label class="form-label small text-white">Wrap Items</label>
                        <select id="quoteType" class="form-select form-select-sm">
                            <option value="none">None</option>
                            <option value="single">Single Quotes (')</option>
                            <option value="double">Double Quotes (")</option>
                        </select>
                    </div>

                    <div class="mb-4">
                        <label class="form-label small text-white">Enclose Result</label>
                        <select id="encloseType" class="form-select form-select-sm mb-2">
                            <option value="none">None</option>
                            <option value="parentheses">Parentheses ( )</option>
                            <option value="brackets">Square Brackets [ ]</option>
                            <option value="curly">Curly Braces { }</option>
                            <option value="custom">Custom...</option>
                        </select>
                        <div id="customEncloseGroup" class="d-none d-flex gap-2">
                            <input type="text" id="customEncloseStart" class="form-control form-control-sm glass-input"
                                placeholder="Start">
                            <input type="text" id="customEncloseEnd" class="form-control form-control-sm glass-input"
                                placeholder="End">
                        </div>
                    </div>

                    <div class="mb-3">
                        <div class="form-check form-switch mb-2">
                            <input class="form-check-input" type="checkbox" id="optionTrim" checked>
                            <label class="form-check-label small text-secondary" for="optionTrim">Trim
                                Whitespace</label>
                        </div>
                        <div class="form-check form-switch mb-2">
                            <input class="form-check-input" type="checkbox" id="optionUnique">
                            <label class="form-check-label small text-secondary" for="optionUnique">Remove
                                Duplicates</label>
                        </div>
                        <div class="form-check form-switch mb-2">
                            <input class="form-check-input" type="checkbox" id="optionSort">
                            <label class="form-check-label small text-secondary" for="optionSort">Sort
                                Alphabetically</label>
                        </div>
                        <div class="form-check form-switch mb-2">
                            <input class="form-check-input" type="checkbox" id="optionIgnoreEmpty" checked>
                            <label class="form-check-label small text-secondary" for="optionIgnoreEmpty">Ignore Empty
                                Lines</label>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Column: Output -->
            <div class="col-lg-5 d-flex flex-column h-100">
                <div class="glass-panel p-4 flex-grow-1 d-flex flex-column">
                    <label for="outputData" class="form-label text-secondary small fw-bold text-uppercase mb-3">Result
                        List</label>
                    <textarea id="outputData" class="form-control glass-input flex-grow-1 p-3" readonly></textarea>
                    <div class="d-flex justify-content-between mt-3 align-items-center">
                        <span class="text-secondary small" id="outputStats">0 items</span>
                        <button id="copyBtn" class="btn btn-primary btn-sm px-4">
                            <i class="bi bi-clipboard"></i> Copy
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="copyToast" class="toast align-items-center text-white bg-success border-0" role="alert"
            aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body">
                    <i class="bi bi-check-circle me-2"></i> Copied to clipboard!
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"
                    aria-label="Close"></button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="converter.js"></script>
</body>

</html>
