<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Permission Set Assignment CSV Generator | Dev Utils</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        /* Mobile adjustments */
        @media (max-width: 991.98px) {
            .perm-set-panel {
                height: 300px;
                /* specific height for mobile usability */
            }

            .glass-panel {
                margin-bottom: 1rem;
            }

            #userIds {
                min-height: 200px;
            }

            #outputPreview {
                min-height: 200px;
            }
        }

        /* Mobile adjustments */
        @media (max-width: 991.98px) {
            .perm-set-panel {
                height: 300px;
                /* specific height for mobile usability */
            }

            .glass-panel {
                margin-bottom: 1rem;
            }

            #userIds {
                min-height: 200px;
            }

            #outputPreview {
                min-height: 200px;
            }
        }
    </style>
</head>

<body class="app-mode">
    <!-- Global Navigation -->
    <!-- Global Navigation -->
    <div class="global-nav">
        <a href="index.html" class="btn global-nav-btn" title="Return to Home" aria-label="Return to Home">
            <i class="bi bi-house-door fs-4"></i>
        </a>
    </div>

    <div class="container-fluid tool-container py-4">
        <!-- Header / Nav -->
        <div class="row mb-4 align-items-center">
            <div class="col-auto">
                <a href="index.html" class="btn btn-outline-light btn-sm rounded-circle p-2" aria-label="Return to Home">
                    <i class="bi bi-arrow-left"></i>
                </a>
            </div>
            <div class="col">
                <h1 class="h4 mb-0 fw-bold">Permission Set Assignment CSV Generator</h1>
            </div>
        </div>

        <div class="row g-4 desktop-h-100">
            <!-- Left Column: Inputs -->
            <div class="col-lg-5 d-flex flex-column desktop-h-100">
                <!-- Type Selection -->
                <div class="glass-panel p-3 mb-3 flex-shrink-0">
                    <label class="form-label text-secondary small fw-bold text-uppercase mb-2">Assignment Type</label>
                    <div class="d-flex gap-3">
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="assignType" id="typePermSet"
                                value="PermissionSet" checked>
                            <label class="form-check-label text-white small" for="typePermSet">
                                Permission Set
                            </label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="assignType" id="typeLicense"
                                value="PermissionSetLicense">
                            <label class="form-check-label text-white small" for="typeLicense">
                                Permission Set License
                            </label>
                        </div>
                    </div>
                </div>

                <!-- User IDs Input (Drag & Drop) -->
                <div class="glass-panel p-4 mb-4 flex-grow-1 d-flex flex-column drag-area" id="dropZone">
                    <label for="userIds" class="form-label text-secondary small fw-bold text-uppercase mb-3">User IDs
                        (Assignees)</label>
                    <textarea id="userIds" class="form-control glass-input flex-grow-1 p-3" placeholder="Paste User IDs here...
Example:
0055f0000053QLvAAM
0055f0000053QLwAAM"></textarea>

                    <div class="d-flex justify-content-between mt-3 align-items-center">
                        <span class="text-secondary small" id="inputStats">0 lines</span>
                        <div class="d-flex gap-2">
                            <button id="cleanUsersBtn" class="btn btn-sm btn-outline-info border-0"
                                title="Extracts valid User IDs (starting with 005) and removes duplicates.">
                                <i class="bi bi-stars me-1"></i> Clean
                            </button>
                            <button id="clearUsersBtn" class="btn btn-sm btn-outline-light text-secondary border-0"
                                onclick="document.getElementById('userIds').value=''; updateStats();">
                                <i class="bi bi-trash me-1"></i> Clear
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Perm Set ID Input -->
                <div class="glass-panel p-4 flex-shrink-0 perm-set-panel">
                    <label for="permSetIds" class="form-label text-secondary small fw-bold text-uppercase mb-2"
                        id="lblPermSetIds">Permission Set IDs (Targets)</label>
                    <textarea id="permSetIds" class="form-control glass-input p-3" placeholder="Paste Permission Set IDs here...
Example:
0PS5f000003biIsGAI
0PS5f000003biItGAI" style="resize: none; height: 100%; font-family: 'Consolas', monospace;"></textarea>

                    <div class="d-flex justify-content-between mt-2 align-items-center">
                        <span class="text-secondary small" id="permStats">0 lines</span>
                        <div class="d-flex gap-2">
                            <button id="cleanPermsBtn" class="btn btn-sm btn-outline-info border-0"
                                title="Extracts valid IDs and removes duplicates.">
                                <i class="bi bi-stars me-1"></i> Clean
                            </button>
                            <button id="clearPermsBtn" class="btn btn-sm btn-outline-light text-secondary border-0"
                                onclick="document.getElementById('permSetIds').value=''; updatePermStats();">
                                <i class="bi bi-trash me-1"></i> Clear
                            </button>
                        </div>
                    </div>
                    <div class="form-text text-secondary small mt-1">Must start with <span id="prefixHint"
                            class="text-info">0PS</span>. 15 or 18 chars.</div>
                </div>
            </div>

            <!-- Middle Column: Actions -->
            <div class="col-lg-2 d-flex flex-column justify-content-center">
                <button id="generateBtn" class="btn btn-primary w-100 py-3 mb-3">
                    <i class="bi bi-file-earmark-spreadsheet me-2"></i> Generate CSV
                </button>

                <div id="validationMessage" class="alert alert-warning d-none small text-center" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-1"></i> <span id="validationText">Invalid Input</span>
                </div>
            </div>

            <!-- Right Column: Output Preview -->
            <div class="col-lg-5 d-flex flex-column desktop-h-100">
                <div class="glass-panel p-4 flex-grow-1 d-flex flex-column">
                    <label class="form-label text-secondary small fw-bold text-uppercase mb-3">Preview</label>
                    <textarea id="outputPreview" class="form-control glass-input flex-grow-1 p-3" readonly
                        placeholder="Generated CSV preview will appear here..."></textarea>

                    <div class="d-flex justify-content-between mt-3 align-items-center">
                        <span class="text-secondary small" id="outputStats">0 rows</span>
                        <div class="d-flex gap-2">
                            <button id="copyExcelBtn" class="btn btn-primary btn-sm" disabled
                                title="Copy for Excel (Tab Separated)">
                                <i class="bi bi-file-earmark-spreadsheet me-2"></i> Copy as Excel
                            </button>
                            <button id="copyCsvBtn" class="btn btn-primary btn-sm" disabled title="Copy as raw CSV">
                                <i class="bi bi-file-earmark-text me-2"></i> Copy as CSV
                            </button>
                            <button id="downloadBtn" class="btn btn-success btn-sm px-4" disabled>
                                <i class="bi bi-download me-2"></i> Download
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="permission-set-assigner.js"></script>
</body>

</html>
