<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Permission Set Assignment CSV Generator | Dev Utils</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        body,
        html {
            height: 100%;
            overflow: hidden;
        }

        .tool-container {
            height: 100vh;
            padding-bottom: 2rem;
            display: flex;
            flex-direction: column;
        }

        .glass-panel {
            display: flex;
            flex-direction: column;
        }

        textarea.glass-input {
            background-color: rgba(15, 23, 42, 0.4);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            resize: none;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 0.9rem;
            flex-grow: 1;
        }

        textarea.glass-input:focus {
            background-color: rgba(15, 23, 42, 0.6);
            border-color: var(--accent-color);
            color: var(--text-primary);
            box-shadow: 0 0 0 0.25rem rgba(56, 189, 248, 0.15);
        }

        /* Drag and Drop Styling */
        .drag-area {
            position: relative;
            transition: all 0.3s ease;
        }

        .drag-area.drag-active {
            border-color: var(--accent-color);
            background-color: rgba(56, 189, 248, 0.1);
        }

        .drag-area.drag-active::after {
            content: 'Drop file here';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: var(--accent-color);
            font-weight: 600;
            pointer-events: none;
            background: rgba(15, 23, 42, 0.9);
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            border: 1px solid var(--accent-color);
        }
    </style>
</head>

<body>
    <!-- Global Navigation -->
    <div class="global-nav dropdown">
        <button class="btn global-nav-btn" type="button" data-bs-toggle="dropdown" aria-expanded="false">
            <i class="bi bi-list fs-4"></i>
        </button>
        <ul class="dropdown-menu dropdown-menu-end global-nav-dropdown">
            <li><a class="dropdown-item" href="index.html"><i class="bi bi-house-door me-2"></i> Home</a></li>
            <li><a class="dropdown-item" href="column-converter.html"><i class="bi bi-list-columns me-2"></i> Column
                    Converter</a></li>
            <li><a class="dropdown-item" href="id-converter.html"><i class="bi bi-card-heading me-2"></i> ID
                    Converter</a></li>
            <li><a class="dropdown-item" href="list-diff.html"><i class="bi bi-intersect me-2"></i> List
                    Difference</a></li>
            <li><a class="dropdown-item active" href="permission-set-assigner.html"><i class="bi bi-people me-2"></i>
                    Perm Set Assigner</a></li>
            <li>
                <hr class="dropdown-divider border-secondary border-opacity-25">
            </li>
            <li><a class="dropdown-item" href="guid-generator.html"><i class="bi bi-asterisk me-2"></i> GUID
                    Generator</a></li>
        </ul>
    </div>

    <div class="container-fluid tool-container py-4">
        <!-- Header / Nav -->
        <div class="row mb-4 align-items-center">
            <div class="col-auto">
                <a href="index.html" class="btn btn-outline-light btn-sm rounded-circle p-2">
                    <i class="bi bi-arrow-left"></i>
                </a>
            </div>
            <div class="col">
                <h1 class="h4 mb-0 fw-bold">Permission Set Assignment CSV Generator</h1>
            </div>
        </div>

        <div class="row g-4 h-100">
            <!-- Left Column: Inputs -->
            <div class="col-lg-5 d-flex flex-column h-100">
                <!-- Type Selection -->
                <div class="glass-panel p-3 mb-3 flex-shrink-0">
                    <label class="form-label text-secondary small fw-bold text-uppercase mb-2">Assignment Type</label>
                    <div class="d-flex gap-3">
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="assignType" id="typePermSet"
                                value="PermissionSet" checked>
                            <label class="form-check-label text-white small" for="typePermSet">
                                Permission Set
                            </label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="assignType" id="typeLicense"
                                value="PermissionSetLicense">
                            <label class="form-check-label text-white small" for="typeLicense">
                                Permission Set License
                            </label>
                        </div>
                    </div>
                </div>

                <!-- User IDs Input (Drag & Drop) -->
                <div class="glass-panel p-4 mb-4 flex-grow-1 d-flex flex-column drag-area" id="dropZone">
                    <label for="userIds" class="form-label text-secondary small fw-bold text-uppercase mb-3">User IDs
                        (Assignees)</label>
                    <textarea id="userIds" class="form-control glass-input flex-grow-1 p-3" placeholder="Paste User IDs here...
Example:
0055f0000053QLvAAM
0055f0000053QLwAAM"></textarea>

                    <div class="d-flex justify-content-between mt-3">
                        <span class="text-secondary small" id="inputStats">0 lines</span>
                        <button class="btn btn-sm btn-outline-light text-secondary border-0"
                            onclick="document.getElementById('userIds').value=''; updateStats();">
                            <i class="bi bi-trash"></i> Clear
                        </button>
                    </div>
                </div>

                <!-- Perm Set ID Input -->
                <div class="glass-panel p-4 flex-shrink-0" style="height: 35%;">
                    <label for="permSetIds" class="form-label text-secondary small fw-bold text-uppercase mb-2"
                        id="lblPermSetIds">Permission Set IDs (Targets)</label>
                    <textarea id="permSetIds" class="form-control glass-input p-3" placeholder="Paste Permission Set IDs here...
Example:
0PS5f000003biIsGAI
0PS5f000003biItGAI" style="resize: none; height: 100%; font-family: 'Consolas', monospace;"></textarea>

                    <div class="d-flex justify-content-between mt-2 align-items-start">
                        <div class="form-text text-secondary small mt-0 flex-grow-1">Must start with <span
                                id="prefixHint" class="text-info">0PS</span>. 15 or 18 chars.</div>
                        <span class="text-secondary small text-nowrap ms-3" id="permStats">0 lines</span>
                    </div>
                </div>
            </div>

            <!-- Middle Column: Actions -->
            <div class="col-lg-2 d-flex flex-column justify-content-center">
                <button id="generateBtn" class="btn btn-primary w-100 py-3 mb-3">
                    <i class="bi bi-file-earmark-spreadsheet me-2"></i> Generate CSV
                </button>

                <div id="validationMessage" class="alert alert-warning d-none small text-center" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-1"></i> <span id="validationText">Invalid Input</span>
                </div>
            </div>

            <!-- Right Column: Output Preview -->
            <div class="col-lg-5 d-flex flex-column h-100">
                <div class="glass-panel p-4 flex-grow-1 d-flex flex-column">
                    <label class="form-label text-secondary small fw-bold text-uppercase mb-3">Preview</label>
                    <textarea id="outputPreview" class="form-control glass-input flex-grow-1 p-3" readonly
                        placeholder="Generated CSV preview will appear here..."></textarea>

                    <div class="d-flex justify-content-between mt-3 align-items-center">
                        <span class="text-secondary small" id="outputStats">0 rows</span>
                        <button id="downloadBtn" class="btn btn-success btn-sm px-4" disabled>
                            <i class="bi bi-download me-2"></i> Download CSV
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="permission-set-assigner.js"></script>
</body>

</html>
