<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Name Generator | Dev Utils</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="favicon.png">

</head>
<body class="app-mode">

    <!-- Global Navigation -->
    <div class="global-nav">
        <a href="index.html" class="btn global-nav-btn" title="Return to Home">
            <i class="bi bi-house-door fs-4"></i>
        </a>
    </div>

    <!-- Main Container -->
    <div class="container-fluid h-100 py-4 d-flex flex-column">
        <!-- Header -->
        <header class="text-center mb-4 flex-shrink-0">
            <h1 class="h2 fw-bold mb-2">API Name <span class="text-gradient">Generator</span></h1>
            <p class="text-secondary mb-0">Convert field/object labels to valid Salesforce API names.</p>
        </header>

        <!-- Main Workspace -->
        <main class="row g-4 flex-grow-1 min-h-0">
            <!-- Left Panel: Input -->
            <div class="col-lg-6 d-flex flex-column h-100">
                <div class="glass-panel p-4 d-flex flex-column h-100">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <label for="inputLabels" class="form-label text-secondary small text-uppercase fw-bold mb-0">Input Labels (One per line)</label>
                        <span id="inputCount" class="badge bg-secondary bg-opacity-25 text-secondary">0 items</span>
                    </div>
                    <textarea id="inputLabels" class="form-control font-monospace flex-grow-1 mb-3"
                        placeholder="e.g.&#10;Customer First Name&#10;Annual ROI (%)&#10;Is Active?"></textarea>

                    <div class="row g-3">
                        <div class="col-sm-6">
                            <label class="form-label text-secondary small">Suffix</label>
                            <select id="suffixSelect" class="form-select bg-dark border-secondary text-white">
                                <option value="__c">Custom Field / Object (__c)</option>
                                <option value="">None (Standard)</option>
                                <option value="__r">Relationship (__r)</option>
                                <option value="__mdt">Custom Metadata Type (__mdt)</option>
                                <option value="__e">Platform Event (__e)</option>
                            </select>
                        </div>
                        <div class="col-sm-6 d-flex align-items-end">
                            <button id="generateBtn" class="btn btn-primary w-100 py-2">
                                <i class="bi bi-gear-fill me-2"></i> Generate
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Panel: Output -->
            <div class="col-lg-6 d-flex flex-column h-100">
                <div class="glass-panel p-4 d-flex flex-column h-100 position-relative">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <label for="outputNames" class="form-label text-secondary small text-uppercase fw-bold mb-0">API Names</label>
                        <span id="outputCount" class="badge bg-primary bg-opacity-25 text-primary">0 items</span>
                    </div>
                    <textarea id="outputNames" class="form-control font-monospace flex-grow-1 mb-3" readonly
                        placeholder="Generated API names will appear here..."></textarea>

                    <div class="d-flex gap-2">
                        <button id="copyBtn" class="btn btn-outline-success flex-grow-1" disabled>
                            <i class="bi bi-clipboard me-2"></i> Copy All
                        </button>
                        <button id="clearBtn" class="btn btn-outline-danger">
                            <i class="bi bi-trash me-2"></i> Clear
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- External Script -->
    <script src="api-name-generator.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
