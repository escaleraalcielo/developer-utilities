<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salesforce ID Converter | Dev Utils</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        body,
        html {
            height: 100%;
            overflow: hidden;
        }

        .tool-container {
            height: 100vh;
            padding-bottom: 2rem;
            display: flex;
            flex-direction: column;
        }

        .glass-panel {
            display: flex;
            flex-direction: column;
        }

        textarea.glass-input {
            background-color: rgba(15, 23, 42, 0.4);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            resize: none;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 0.9rem;
            flex-grow: 1;
        }

        textarea.glass-input:focus {
            background-color: rgba(15, 23, 42, 0.6);
            border-color: var(--accent-color);
            color: var(--text-primary);
            box-shadow: 0 0 0 0.25rem rgba(56, 189, 248, 0.15);
        }
    </style>
</head>

<body>
    <!-- Global Navigation -->
    <div class="global-nav dropdown">
        <button class="btn global-nav-btn" type="button" data-bs-toggle="dropdown" aria-expanded="false">
            <i class="bi bi-list fs-4"></i>
        </button>
        <ul class="dropdown-menu dropdown-menu-end global-nav-dropdown">
            <li><a class="dropdown-item" href="index.html"><i class="bi bi-house-door me-2"></i> Home</a></li>
            <li><a class="dropdown-item" href="column-converter.html"><i class="bi bi-list-columns me-2"></i> Column
                    Converter</a></li>
            <li><a class="dropdown-item active" href="id-converter.html"><i class="bi bi-card-heading me-2"></i> ID
                    Converter</a></li>
            <li>
                <hr class="dropdown-divider border-secondary border-opacity-25">
            </li>
            <li><a class="dropdown-item" href="guid-generator.html"><i class="bi bi-asterisk me-2"></i> GUID
                    Generator</a></li>
        </ul>
    </div>

    <div class="container-fluid tool-container py-4">
        <!-- Header / Nav -->
        <div class="row mb-4 align-items-center">
            <div class="col-auto">
                <a href="index.html" class="btn btn-outline-light btn-sm rounded-circle p-2">
                    <i class="bi bi-arrow-left"></i>
                </a>
            </div>
            <div class="col">
                <h1 class="h4 mb-0 fw-bold">Salesforce ID Converter (15 to 18)</h1>
            </div>
        </div>

        <div class="row g-4 h-100">
            <!-- Left Column: Input -->
            <div class="col-lg-5 d-flex flex-column h-100">
                <div class="glass-panel p-4 flex-grow-1 d-flex flex-column">
                    <label for="inputData" class="form-label text-secondary small fw-bold text-uppercase mb-3">Input IDs
                        (15 characters)</label>
                    <textarea id="inputData" class="form-control glass-input flex-grow-1 p-3"
                        placeholder="Paste Salesforce IDs here...&#10;0015500000Wv25U"></textarea>

                    <div class="d-flex justify-content-between mt-3">
                        <span class="text-secondary small" id="inputStats">0 lines</span>
                        <button class="btn btn-sm btn-outline-light text-secondary border-0"
                            onclick="document.getElementById('inputData').value=''; updateConversion();">
                            <i class="bi bi-trash"></i> Clear
                        </button>
                    </div>
                </div>
            </div>

            <!-- Middle Column: Controls -->
            <div class="col-lg-2">
                <div class="glass-panel p-3 h-100">
                    <h6 class="text-secondary small fw-bold text-uppercase mb-3">Configuration</h6>

                    <div class="mb-3">
                        <div class="form-check form-switch mb-2">
                            <input class="form-check-input" type="checkbox" id="optionSoql">
                            <label class="form-check-label small text-secondary" for="optionSoql">Convert to SOQL
                                List</label>
                        </div>
                        <div class="form-text text-secondary small fst-italic ms-1" style="font-size: 0.75rem;">
                            Formats as 'ID1', 'ID2' for queries.
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Column: Output -->
            <div class="col-lg-5 d-flex flex-column h-100">
                <div class="glass-panel p-4 flex-grow-1 d-flex flex-column">
                    <label for="outputData" class="form-label text-secondary small fw-bold text-uppercase mb-3">Result
                        (18 characters)</label>
                    <textarea id="outputData" class="form-control glass-input flex-grow-1 p-3" readonly></textarea>

                    <!-- Validation Warning -->
                    <div id="validationMessage" class="alert alert-warning d-none mt-2 mb-0 py-2 small" role="alert">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i>
                        <span id="validationText"></span>
                    </div>

                    <div class="d-flex justify-content-between mt-3 align-items-center">
                        <span class="text-secondary small" id="outputStats">0 items</span>
                        <button id="copyBtn" class="btn btn-primary btn-sm px-4">
                            <i class="bi bi-clipboard"></i> Copy
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Toast Notification -->
        <div class="toast-container position-fixed bottom-0 end-0 p-3">
            <div id="copyToast" class="toast align-items-center text-white bg-success border-0" role="alert"
                aria-live="assertive" aria-atomic="true">
                <div class="d-flex">
                    <div class="toast-body">
                        <i class="bi bi-check-circle me-2"></i> Copied to clipboard!
                    </div>
                    <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"
                        aria-label="Close"></button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="id-converter.js"></script>
</body>

</html>
