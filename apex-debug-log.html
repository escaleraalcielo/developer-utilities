<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex Debug Log Filter | Dev Utils</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        /* Mobile overrides */
        @media (max-width: 991.98px) {
            .glass-panel {
                margin-bottom: 1rem;
            }

            #inputData,
            #outputData {
                min-height: 200px;
            }
        }

        .glass-panel {
            display: flex;
            flex-direction: column;
        }

        textarea.glass-input {
            flex-grow: 1;
            flex-shrink: 1;
            min-height: 0;
            white-space: pre;
            overflow-wrap: normal;
            overflow-x: auto;
        }

        /* Log Output Area */
        #outputData {
            flex-grow: 1;
            flex-shrink: 1;
            min-height: 0;
            white-space: pre;
            overflow-wrap: normal;
            overflow-x: auto;
            overflow-y: auto;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(148, 163, 184, 0.1);
            border-radius: 0.375rem;
            color: #f8fafc;
            padding: 1rem;
            font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
            font-size: 14px;
            line-height: 1.5;
        }

        /* Syntax Highlighting Classes */
        .log-error { color: #ef4444; font-weight: 600; }
        .log-flow { color: #38bdf8; }
        .log-debug { color: #10b981; font-weight: 500; }
        .log-limit { color: #f59e0b; }
        .log-timestamp { color: #94a3b8; }
        .log-line { display: block; padding: 1px 0; }
        .log-line:hover { background: rgba(148, 163, 184, 0.05); }

        /* Font Options */
        .font-jetbrains { font-family: 'JetBrains Mono', monospace !important; }
        .font-fira { font-family: 'Fira Code', monospace !important; }
        .font-consolas { font-family: Consolas, monospace !important; }
        .font-menlo { font-family: Menlo, monospace !important; }

        /* Display Controls */
        .display-controls {
            background: rgba(15, 23, 42, 0.4);
            border-radius: 0.5rem;
            padding: 0.75rem;
            margin-bottom: 1rem;
        }

        .display-controls .form-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.25rem;
        }

        .display-controls .form-select,
        .display-controls .form-control {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(148, 163, 184, 0.2);
            color: #f8fafc;
            font-size: 0.8rem;
        }

        .display-controls .form-select:focus,
        .display-controls .form-control:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 0.25rem rgba(56, 189, 248, 0.25);
            background: rgba(15, 23, 42, 0.8);
        }

        .display-controls .form-check-input {
            background-color: rgba(15, 23, 42, 0.6);
            border-color: rgba(148, 163, 184, 0.3);
        }

        .display-controls .form-check-input:checked {
            background-color: #38bdf8;
            border-color: #38bdf8;
        }

        .display-controls .form-check-label {
            font-size: 0.8rem;
        }

        .btn-reset {
            font-size: 0.7rem;
            padding: 0.25rem 0.5rem;
        }
    </style>
</head>

<body class="app-mode">
    <!-- Global Navigation -->
    <div class="global-nav">
        <a href="index.html" class="btn global-nav-btn" title="Return to Home" aria-label="Return to Home">
            <i class="bi bi-house-door fs-4"></i>
        </a>
    </div>

    <div class="container-fluid tool-container py-4">
        <!-- Header / Nav -->
        <div class="row mb-4 align-items-center">
            <div class="col-auto">
                <a href="index.html" class="btn btn-outline-light btn-sm rounded-circle p-2" aria-label="Return to Home">
                    <i class="bi bi-arrow-left"></i>
                </a>
            </div>
            <div class="col">
                <h1 class="h4 mb-0 fw-bold">Apex Debug Log Filter</h1>
            </div>
        </div>

        <div class="row g-4 desktop-h-100">
            <!-- Left Column: Input -->
            <div class="col-lg-5 d-flex flex-column desktop-h-100">
                <div class="glass-panel p-4 flex-grow-1 d-flex flex-column">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <label for="inputData" class="form-label text-secondary small fw-bold text-uppercase mb-0">Raw Debug Log</label>
                        <input type="file" id="logFileInput" accept=".log,.txt,text/plain" style="display: none;">
                        <button id="uploadBtn" class="btn btn-sm btn-outline-light text-secondary border-0">
                            <i class="bi bi-upload"></i> Upload
                        </button>
                    </div>
                    <textarea id="inputData" class="form-control glass-input flex-grow-1 p-3"
                        placeholder="Paste raw Salesforce debug log here or upload a file..."></textarea>

                    <div class="d-flex justify-content-between mt-3">
                        <span class="text-secondary small" id="inputStats">0 lines</span>
                        <div>
                            <button id="loadSampleBtn" class="btn btn-sm btn-outline-light text-secondary border-0 me-2" title="Load Sample Data">
                                <i class="bi bi-file-earmark-text"></i> Load Sample
                            </button>
                            <button class="btn btn-sm btn-outline-light text-secondary border-0"
                                onclick="document.getElementById('inputData').value=''; window.updateFilter();">
                                <i class="bi bi-trash"></i> Clear
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Middle Column: Controls -->
            <div class="col-lg-2">
                <div class="glass-panel p-3 h-100">
                    <h6 class="text-secondary small fw-bold text-uppercase mb-3">Filter Options</h6>

                    <div class="mb-3">
                        <div class="form-check mb-2">
                            <input class="form-check-input filter-checkbox" type="checkbox" id="filterUserDebug" value="USER_DEBUG" checked>
                            <label class="form-check-label small text-secondary" for="filterUserDebug">USER_DEBUG</label>
                        </div>
                        <div class="form-check mb-2">
                            <input class="form-check-input filter-checkbox" type="checkbox" id="filterException" value="EXCEPTION_THROWN" checked>
                            <label class="form-check-label small text-secondary" for="filterException">EXCEPTION_THROWN</label>
                        </div>
                        <div class="form-check mb-2">
                            <input class="form-check-input filter-checkbox" type="checkbox" id="filterFatalError" value="FATAL_ERROR" checked>
                            <label class="form-check-label small text-secondary" for="filterFatalError">FATAL_ERROR</label>
                        </div>
                        <div class="form-check mb-2">
                            <input class="form-check-input filter-checkbox" type="checkbox" id="filterMethodEntry" value="METHOD_ENTRY">
                            <label class="form-check-label small text-secondary" for="filterMethodEntry">METHOD_ENTRY</label>
                        </div>
                        <div class="form-check mb-2">
                            <input class="form-check-input filter-checkbox" type="checkbox" id="filterMethodExit" value="METHOD_EXIT">
                            <label class="form-check-label small text-secondary" for="filterMethodExit">METHOD_EXIT</label>
                        </div>
                        <div class="form-check mb-2">
                            <input class="form-check-input filter-checkbox" type="checkbox" id="filterSoql" value="SOQL_EXECUTE_BEGIN">
                            <label class="form-check-label small text-secondary" for="filterSoql">SOQL_EXECUTE_BEGIN</label>
                        </div>
                        <hr class="border-secondary opacity-25 my-3">
                        <div class="form-group mb-2">
                            <label for="customFilter" class="form-label small text-secondary mb-1">Custom Filter (Contains)</label>
                            <input type="text" id="customFilter" class="form-control form-control-sm bg-dark text-light border-secondary" placeholder="e.g. Account">
                        </div>
                    </div>

                    <h6 class="text-secondary small fw-bold text-uppercase mb-2 mt-4">Display Options</h6>
                    <div class="display-controls">
                        <!-- Highlight Toggle -->
                        <div class="form-check form-switch mb-3">
                            <input class="form-check-input" type="checkbox" id="highlightToggle" checked>
                            <label class="form-check-label text-secondary" for="highlightToggle">Syntax Highlight</label>
                        </div>

                        <!-- Font Family -->
                        <div class="mb-2">
                            <label for="fontFamily" class="form-label text-secondary">Font Family</label>
                            <select id="fontFamily" class="form-select form-select-sm">
                                <option value="system">System Default</option>
                                <option value="jetbrains">JetBrains Mono</option>
                                <option value="fira">Fira Code</option>
                                <option value="consolas">Consolas</option>
                                <option value="menlo">Menlo</option>
                            </select>
                        </div>

                        <!-- Font Size -->
                        <div class="mb-2">
                            <label for="fontSize" class="form-label text-secondary">Font Size: <span id="fontSizeValue">14</span>px</label>
                            <input type="range" id="fontSize" class="form-range" min="10" max="20" value="14">
                        </div>

                        <!-- Reset Button -->
                        <div class="text-end">
                            <button id="resetDisplayBtn" class="btn btn-outline-light btn-reset text-secondary border-0">
                                <i class="bi bi-arrow-counterclockwise"></i> Reset
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Column: Output -->
            <div class="col-lg-5 d-flex flex-column desktop-h-100">
                <div class="glass-panel p-4 flex-grow-1 d-flex flex-column">
                    <label class="form-label text-secondary small fw-bold text-uppercase mb-3">Filtered Log</label>
                    <div id="outputData" class="flex-grow-1"></div>

                    <div class="d-flex justify-content-between mt-3 align-items-center">
                        <span class="text-secondary small" id="outputStats">0 lines shown</span>
                        <div>
                            <button id="saveBtn" class="btn btn-success btn-sm px-4 me-2">
                                <i class="bi bi-download"></i> Save
                            </button>
                            <button id="copyBtn" class="btn btn-primary btn-sm px-4">
                                <i class="bi bi-clipboard"></i> Copy
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>


    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="sample-data.js"></script>
    <script src="apex-debug-log.js"></script>
</body>

</html>
