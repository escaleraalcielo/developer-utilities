<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOQL Formatter | Dev Utils</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        .soql-input {
            font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
            font-size: 0.9rem;
            line-height: 1.5;
            white-space: pre;
        }
    </style>
</head>
<body class="app-mode">

    <!-- Global Navigation -->
    <div class="global-nav">
        <a href="index.html" class="btn global-nav-btn" title="Return to Home" aria-label="Return to Home">
            <i class="bi bi-house-door fs-4"></i>
        </a>
    </div>

    <div class="container-fluid tool-container py-4">
        <!-- Header / Nav -->
        <div class="row mb-4 align-items-center">
            <div class="col">
                <h1 class="h4 mb-0 fw-bold">SOQL Formatter / Validator</h1>
                <p class="text-secondary small mb-0 mt-1">Pretty-print Salesforce SOQL queries with proper indentation. Validate SELECT/FROM structure, balanced parens, and unterminated strings.</p>
            </div>
        </div>

        <!-- Mode Bar -->
        <div class="row mb-3">
            <div class="col-12">
                <div class="glass-panel p-3">
                    <div class="row g-3 align-items-end">
                        <div class="col-md-7">
                            <label class="form-label text-secondary small fw-bold text-uppercase mb-2">Action</label>
                            <div class="btn-group w-100" role="group" aria-label="Action">
                                <input type="radio" class="btn-check" name="action" id="formatBtn" autocomplete="off" checked>
                                <label class="btn btn-outline-light" for="formatBtn"><i class="bi bi-text-indent-left me-1"></i> Format</label>

                                <input type="radio" class="btn-check" name="action" id="validateBtn" autocomplete="off">
                                <label class="btn btn-outline-light" for="validateBtn"><i class="bi bi-shield-check me-1"></i> Validate</label>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <label for="indentSelect" class="form-label text-secondary small fw-bold text-uppercase mb-2">Indent</label>
                            <select id="indentSelect" class="form-select">
                                <option value="2" selected>2 Spaces</option>
                                <option value="4">4 Spaces</option>
                                <option value="tab">Tab</option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <button id="clearBtn" class="btn btn-outline-light btn-sm text-secondary border-0">
                                <i class="bi bi-trash me-1"></i> Clear
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Status -->
        <div id="validationStatus" class="alert alert-status d-none mb-3" role="alert"></div>

        <!-- Main Workspace -->
        <main class="row g-4 flex-grow-1 min-h-0">
            <!-- Left Panel: Input -->
            <div class="col-lg-6 d-flex flex-column h-100">
                <div class="glass-panel p-4 d-flex flex-column h-100">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <label for="inputSoql" class="form-label text-secondary small fw-bold text-uppercase mb-2">Raw SOQL</label>
                        <div class="d-flex gap-2">
                            <button id="loadSampleBtn" class="btn btn-sm btn-outline-light text-secondary border-0" title="Load Sample" aria-label="Load Sample">
                                <i class="bi bi-file-earmark-text"></i> <span class="d-none d-md-inline ms-1">Sample</span>
                            </button>
                        </div>
                    </div>
                    <textarea id="inputSoql" class="form-control glass-input soql-input flex-grow-1 p-3"
                        placeholder="Paste SOQL here...&#10;&#10;e.g.&#10;SELECT Id, Name, Account.Industry FROM Contact WHERE Account.Industry != null ORDER BY Name LIMIT 10"></textarea>
                </div>
            </div>

            <!-- Right Panel: Output -->
            <div class="col-lg-6 d-flex flex-column h-100">
                <div class="glass-panel p-4 d-flex flex-column h-100">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <label for="outputSoql" class="form-label text-secondary small fw-bold text-uppercase mb-2">Formatted Output</label>
                        <span id="outputStats" class="badge bg-secondary bg-opacity-10 text-secondary"></span>
                    </div>
                    <textarea id="outputSoql" class="form-control glass-input soql-input flex-grow-1 p-3" readonly
                        placeholder="Formatted SOQL will appear here..."></textarea>
                    <div class="d-flex justify-content-end mt-3">
                        <button id="copyBtn" class="btn btn-primary btn-sm" disabled>
                            <i class="bi bi-clipboard me-1"></i> Copy
                        </button>
                    </div>
                </div>
            </div>
        </main>
    <footer class="text-center mt-4 pt-4 text-secondary border-top border-secondary border-opacity-10">
        <p class="small">© 2026 Dev Utils. Runs locally. No data leaves your browser. | <a
                href="https://github.com/escaleraalcielo/developer-utilities"
                class="text-secondary text-decoration-none hover-white"><i class="bi bi-github"></i> View Source</a> |
            <a href="style-guide.html" class="text-secondary text-decoration-none hover-white"><i class="bi bi-palette"></i> Style Guide</a>
        </p>
    </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="sample-data.js"></script>
    <script src="history.js"></script>
    <script src="soql-formatter.js"></script>
</body>
</html>
