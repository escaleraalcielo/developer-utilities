<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GUID Generator | Dev Utils</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        /* Mobile overrides */
        @media (max-width: 991.98px) {
            #output {
                min-height: 200px;
            }
        }
    </style>
</head>

<body class="app-mode">
    <!-- Global Navigation -->
    <div class="global-nav">
        <a href="index.html" class="btn global-nav-btn" title="Return to Home" aria-label="Return to Home">
            <i class="bi bi-house-door fs-4"></i>
        </a>
    </div>

    <div class="container-fluid tool-container py-4">
        <!-- Header / Nav -->
        <div class="row mb-4 align-items-center">
            <div class="col">
                <h1 class="h4 mb-0 fw-bold">GUID Generator</h1>
            </div>
        </div>

        <div class="row g-4 desktop-h-100">
            <!-- Left Column: Controls -->
            <div class="col-lg-3">
                <div class="glass-panel p-4 h-100">
                    <h6 class="text-secondary small fw-bold text-uppercase mb-4">Configuration</h6>

                    <div class="mb-4">
                        <label for="guidCount" class="form-label text-white small">Number of GUIDs</label>
                        <input type="number" id="guidCount" class="form-control glass-input mb-3" value="1" min="1" max="20"
                            style="flex-grow: 0;">
                        <input type="range" class="form-range" id="guidCountSlider" min="0" max="7" step="1" value="0">
                        <div class="form-text text-secondary small mt-1">Max 20 at a time</div>
                    </div>

                    <button id="generateBtn" class="btn btn-primary w-100 mb-3">
                        <i class="bi bi-gear-fill me-2"></i> Generate
                    </button>

                    <div id="statusText" class="text-info small text-center mt-2" style="min-height: 20px;"></div>
                </div>
            </div>

            <!-- Right Column: Output -->
            <div class="col-lg-9 d-flex flex-column">
                <div class="glass-panel p-4 flex-grow-1 d-flex flex-column" style="min-height: 0;">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <label for="output"
                            class="form-label text-secondary small fw-bold text-uppercase mb-0">Result</label>
                        <button id="copyResultBtn" class="btn btn-primary btn-sm" disabled>
                            <i class="bi bi-clipboard me-1"></i> Copy
                        </button>
                    </div>
                    <textarea id="output" class="form-control glass-input flex-grow-1 p-3" readonly></textarea>
                </div>
            </div>
        </div>

        <!-- History Panel -->
        <div class="row mt-4">
            <div class="col-12">
                <div class="glass-panel p-0">
                    <div class="p-3 border-bottom border-secondary border-opacity-10 d-flex justify-content-between align-items-center">
                        <h6 class="text-secondary small fw-bold text-uppercase mb-0">History <span class="text-secondary opacity-50 small ms-1">(Last 10 items)</span>
                            <span class="badge bg-secondary bg-opacity-25 ms-2" id="historyCount">0/10</span>
                        </h6>
                        <button class="btn btn-sm btn-link text-secondary text-decoration-none dropdown-toggle small" type="button" data-bs-toggle="collapse" data-bs-target="#historyTableContainer">Toggle</button>
                    </div>
                    <div class="collapse show" id="historyTableContainer">
                        <div class="table-responsive">
                            <table class="table table-dark table-hover table-sm mb-0 align-middle">
                                <thead>
                                    <tr>
                                        <th scope="col" style="width: 90px;">Time</th>
                                        <th scope="col" style="width: 120px;">Type</th>
                                        <th scope="col">Preview</th>
                                        <th scope="col" style="width: 100px;" class="text-end">Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="historyTableBody">
                                    <tr class="text-center">
                                        <td colspan="4" class="py-4 text-secondary opacity-50 fst-italic">No saved results in this session.</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    <footer class="text-center mt-4 pt-4 text-secondary border-top border-secondary border-opacity-10">
        <p class="small">© 2026 Dev Utils. Runs locally. No data leaves your browser. | <a
                href="https://github.com/escaleraalcielo/developer-utilities"
                class="text-secondary text-decoration-none hover-white"><i class="bi bi-github"></i> View Source</a> |
            <a href="style-guide.html" class="text-secondary text-decoration-none hover-white"><i class="bi bi-palette"></i> Style Guide</a>
        </p>
    </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="history.js"></script>
    <script src="guid-generator.js"></script>
</body>

</html>
