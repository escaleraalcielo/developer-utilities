<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GUID Generator | Dev Utils</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        /* Mobile overrides */
        @media (max-width: 991.98px) {
            .glass-panel {
                margin-bottom: 1rem;
            }

            #output {
                min-height: 200px;
            }
        }

        .glass-panel {
            display: flex;
            flex-direction: column;
        }

        textarea.glass-input {
            background-color: rgba(15, 23, 42, 0.4);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            resize: none;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 0.9rem;
            flex-grow: 1;
        }

        textarea.glass-input:focus {
            background-color: rgba(15, 23, 42, 0.6);
            border-color: var(--accent-color);
            color: var(--text-primary);
            box-shadow: 0 0 0 0.25rem rgba(56, 189, 248, 0.15);
        }
    </style>
</head>

<body class="app-mode">
    <!-- Global Navigation -->
    <!-- Global Navigation -->
    <div class="global-nav">
        <a href="index.html" class="btn global-nav-btn" title="Return to Home" aria-label="Return to Home">
            <i class="bi bi-house-door fs-4"></i>
        </a>
    </div>

    <div class="container-fluid tool-container py-4">
        <!-- Header / Nav -->
        <div class="row mb-4 align-items-center">
            <div class="col-auto">
                <a href="index.html" class="btn btn-outline-light btn-sm rounded-circle p-2" aria-label="Return to Home">
                    <i class="bi bi-arrow-left"></i>
                </a>
            </div>
            <div class="col">
                <h1 class="h4 mb-0 fw-bold">GUID Generator</h1>
            </div>
        </div>

        <div class="row g-4 desktop-h-100">
            <!-- Left Column: Controls -->
            <div class="col-lg-3">
                <div class="glass-panel p-4 h-100">
                    <h6 class="text-secondary small fw-bold text-uppercase mb-4">Configuration</h6>

                    <div class="mb-4">
                        <label for="guidCount" class="form-label text-white small">Number of GUIDs</label>
                        <input type="number" id="guidCount" class="form-control glass-input mb-3" value="1" min="1" max="20"
                            style="flex-grow: 0;">
                        <input type="range" class="form-range" id="guidCountSlider" min="0" max="7" step="1" value="0">
                        <div class="form-text text-secondary small mt-1">Max 20 at a time</div>
                    </div>

                    <button id="generateBtn" class="btn btn-primary w-100 mb-3">
                        <i class="bi bi-gear-fill me-2"></i> Generate
                    </button>

                    <div id="statusText" class="text-info small text-center mt-2" style="min-height: 20px;"></div>
                </div>
            </div>

            <!-- Right Column: Output -->
            <div class="col-lg-9 d-flex flex-column desktop-h-100">
                <div class="glass-panel p-4 flex-grow-1 d-flex flex-column" style="min-height: 0;">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <label for="output"
                            class="form-label text-secondary small fw-bold text-uppercase mb-0">Result</label>
                        <button id="copyResultBtn" class="btn btn-primary btn-sm px-3" disabled>
                            <i class="bi bi-clipboard-check"></i> Copy Result
                        </button>
                    </div>
                    <textarea id="output" class="form-control glass-input flex-grow-1 p-3" readonly></textarea>
                </div>

                <!-- History Panel (Bottom of this column) -->
                <div class="glass-panel mt-4 flex-grow-0" style="height: 300px; min-height: 300px;">
                    <div
                        class="p-3 border-bottom border-secondary border-opacity-10 d-flex justify-content-between align-items-center">
                        <h6 class="text-secondary small fw-bold text-uppercase mb-0">Session History</h6>
                        <span class="badge bg-secondary bg-opacity-25" id="historyCount">0/20</span>
                    </div>
                    <div class="flex-grow-1 overflow-auto">
                        <table class="table table-dark table-hover mb-0 text-secondary small bg-transparent">
                            <thead class="sticky-top bg-dark">
                                <tr>
                                    <th scope="col" style="width: 100px;">Time</th>
                                    <th scope="col" style="width: 80px;">Count</th>
                                    <th scope="col">First GUID</th>
                                    <th scope="col" style="width: 100px;" class="text-end">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="historyTableBody">
                                <tr class="text-center">
                                    <td colspan="4" class="py-4 text-secondary opacity-50 fst-italic">No saved history.
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="guid-generator.js"></script>
</body>

</html>
