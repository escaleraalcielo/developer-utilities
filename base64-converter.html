<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base64 Converter | Dev Utils</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        .drag-area {
            border: 2px dashed rgba(148, 163, 184, 0.2);
            transition: all 0.3s ease;
        }

        .drag-area.active {
            border-color: var(--accent-color);
            background: rgba(56, 189, 248, 0.1);
        }

        /* Custom Tabs */
        .nav-pills .nav-link {
            color: var(--text-secondary);
            background: rgba(30, 41, 59, 0.4);
            border: 1px solid var(--border-color);
            margin-right: 0.5rem;
            border-radius: 0.5rem;
        }

        .nav-pills .nav-link:hover {
            color: var(--text-primary);
            background: rgba(30, 41, 59, 0.8);
        }

        .nav-pills .nav-link.active {
            background: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
        }
    </style>
</head>

<body class="app-mode">
    <!-- Global Navigation -->
    <div class="global-nav">
        <a href="index.html" class="btn global-nav-btn" title="Return to Home">
            <i class="bi bi-house-door fs-4"></i>
        </a>
    </div>

    <div class="container-fluid tool-container py-4">
        <!-- Header / Nav -->
        <div class="row mb-4 align-items-center">
            <div class="col-auto">
                <a href="index.html" class="btn btn-outline-light btn-sm rounded-circle p-2">
                    <i class="bi bi-arrow-left"></i>
                </a>
            </div>
            <div class="col">
                <h1 class="h4 mb-0 fw-bold">Base64 Converter</h1>
            </div>
        </div>

        <!-- Main Content -->
        <div class="row g-4 flex-grow-1">
            <!-- Left Column: Input -->
            <div class="col-lg-5 d-flex flex-column desktop-h-100">
                <div class="glass-panel p-4 mb-4 flex-grow-1 d-flex flex-column">

                    <!-- Mode Toggles (Tabs) -->
                    <ul class="nav nav-pills mb-4" id="modeTab" role="tablist">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link active" id="file-tab" data-bs-toggle="pill"
                                data-bs-target="#file-mode" type="button" role="tab" aria-selected="true"><i
                                    class="bi bi-file-earmark me-2"></i>File to Base64</button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link" id="text-tab" data-bs-toggle="pill" data-bs-target="#text-mode"
                                type="button" role="tab" aria-selected="false"><i class="bi bi-textarea-t me-2"></i>Text
                                String</button>
                        </li>
                    </ul>

                    <div class="tab-content flex-grow-1 d-flex flex-column" id="modeTabContent">

                        <!-- File Mode -->
                        <div class="tab-pane fade show active flex-grow-1 d-flex flex-column" id="file-mode"
                            role="tabpanel">
                            <label class="form-label text-secondary small fw-bold text-uppercase mb-3">Input
                                File</label>

                            <div id="dropZone"
                                class="drag-area rounded-3 flex-grow-1 d-flex flex-column align-items-center justify-content-center p-5 text-center cursor-pointer">
                                <i class="bi bi-cloud-upload display-4 text-secondary mb-3"></i>
                                <h4 class="h6 text-white mb-2">Drag & Drop file here</h4>
                                <p class="text-secondary small mb-3">or click to browse</p>
                                <input type="file" id="fileInput" class="d-none">
                                <button class="btn btn-primary btn-sm"
                                    onclick="document.getElementById('fileInput').click()">
                                    Browse Files
                                </button>
                                <p class="text-secondary small mt-4 mb-0 opacity-75">Maximum file size: 5MB for optimal
                                    performance</p>
                            </div>
                        </div>

                        <!-- Text Mode -->
                        <div class="tab-pane fade flex-grow-1 d-flex flex-column" id="text-mode" role="tabpanel">
                            <label class="form-label text-secondary small fw-bold text-uppercase mb-2">Input
                                Text</label>

                            <!-- Encode/Decode Toggle -->
                            <div class="d-flex gap-3 mb-3">
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="textMode" id="modeEncode"
                                        value="encode" checked>
                                    <label class="form-check-label text-white small" for="modeEncode">
                                        Encode (Text &rarr; Base64)
                                    </label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="textMode" id="modeDecode"
                                        value="decode">
                                    <label class="form-check-label text-white small" for="modeDecode">
                                        Decode (Base64 &rarr; Text)
                                    </label>
                                </div>
                            </div>

                            <textarea id="inputText" class="form-control glass-input flex-grow-1 p-3"
                                placeholder="Type or paste text here (Max 5000 chars)..." maxlength="5000"></textarea>

                            <div class="d-flex justify-content-end mt-2">
                                <span class="text-secondary small" id="charCount">0/5000</span>
                            </div>
                        </div>
                    </div>

                    <!-- Common Validation Alert -->
                    <div id="validationMessage" class="alert alert-warning mt-3 mb-0 d-none text-center" role="alert">
                        <i class="bi bi-exclamation-triangle-fill me-1"></i> <span id="validationText">Error
                            message</span>
                    </div>

                </div>
            </div>

            <!-- Middle Column: Actions (Visual Arrow) -->
            <div class="col-lg-1 d-none d-lg-flex flex-column justify-content-center align-items-center text-secondary">
                <i class="bi bi-arrow-right fs-1"></i>
            </div>

            <!-- Right Column: Output -->
            <div class="col-lg-6 d-flex flex-column desktop-h-100">
                <div class="glass-panel p-4 flex-grow-1 d-flex flex-column">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <label class="form-label text-secondary small fw-bold text-uppercase mb-0">Result</label>
                        <span id="outputStats" class="badge bg-secondary bg-opacity-10 text-secondary">No input</span>
                    </div>

                    <textarea id="output" class="form-control glass-input flex-grow-1 p-3" readonly
                        placeholder="Result will appear here..."></textarea>

                    <div class="d-flex justify-content-end gap-2 mt-3">
                        <button id="clearBtn" class="btn btn-outline-light btn-sm text-secondary border-0">
                            <i class="bi bi-trash me-1"></i> Clear
                        </button>
                        <button id="copyBtn" class="btn btn-primary btn-sm" disabled>
                            <i class="bi bi-clipboard me-1"></i> Copy to Clipboard
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- History Panel -->
        <div class="row mt-4 flex-grow-0" style="height: 300px; min-height: 300px;">
            <div class="col-12 h-100">
                <div class="glass-panel p-0 h-100 d-flex flex-column">
                    <div
                        class="p-3 border-bottom border-secondary border-opacity-10 d-flex justify-content-between align-items-center">
                        <h6 class="text-secondary small fw-bold text-uppercase mb-0">History <span
                                class="text-secondary opacity-50 small ms-1">(Last 10 items, oldest removed)</span>
                            <span class="badge bg-secondary bg-opacity-25 ms-2" id="historyCount">0/10</span></h6>
                        <button class="btn btn-xs btn-link text-secondary text-decoration-none dropdown-toggle small"
                            type="button" data-bs-toggle="collapse" data-bs-target="#historyTableContainer">
                            Toggle
                        </button>
                    </div>
                    <div class="flex-grow-1 overflow-auto collapse show" id="historyTableContainer">
                        <table class="table table-dark table-hover mb-0 text-secondary small bg-transparent">
                            <thead class="sticky-top bg-dark">
                                <tr>
                                    <th scope="col" style="width: 100px;">Time</th>
                                    <th scope="col" style="width: 120px;">Type</th>
                                    <th scope="col">Preview</th>
                                    <th scope="col" style="width: 100px;" class="text-end">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="historyTableBody">
                                <!-- History Rows -->
                                <tr class="text-center">
                                    <td colspan="4" class="py-4 text-secondary opacity-50 fst-italic">No saved results
                                        in this session.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- Toast Container -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="copyToast" class="toast align-items-center text-bg-success border-0" role="alert" aria-live="assertive"
            aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body">
                    <i class="bi bi-check-circle-fill me-2"></i> Copied to clipboard!
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"
                    aria-label="Close"></button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="base64-converter.js"></script>
</body>

</html>
